version: '3.8'

services:
  # Self-Hosted PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: prooflog-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: prooflog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prooflog"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Idempotency Cache & BullMQ Queue Broker
  redis:
    image: redis:7-alpine
    container_name: prooflog-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ProofLog API Gateway (Hono Serverless & HTTP API)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: prooflog-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/prooflog
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ProofLog NestJS Background Worker (Cryptographic Hash Chainer & Queue Consumer)
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: prooflog-worker
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/prooflog
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
